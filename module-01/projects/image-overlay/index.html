<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image overlay</title>
  <style>
    body {
      background-color: #f0f0f0;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      /* border: 1px solid #000; */
      margin: 3rem 0;
    }

    .image-container {
      width: 500px;
      height: 500px;
      /* border: 1px solid red; */
      position: relative;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-overlay {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: -20%;
      z-index: 1;
      /* border: 1px solid red; */
      color: white;
      opacity: 0;
      transition: all 0.4s ease-in;

    }

    .image-container:hover .image-overlay {
      opacity: 1;
      left: 0;
    }


    .image-container::after {
      content: "";
      display: block;
      position: absolute;
      /* width: 100px; */
      /* height: 100px; */
      background-color: rgb(0, 0, 0, 0.3);

      inset: 0;
      opacity: 0;
      transition: all 0.4s;
    }


    .image-container:hover::after {
      opacity: 1;
    }

  <div class="container">

      <img
        src="https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?q=80&w=1738&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
