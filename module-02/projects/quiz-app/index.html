<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A focused general-knowledge study quiz.">
  <title>BrightQuiz | Study Check</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#quiz" aria-label="BrightQuiz home"><span class="brand-mark" aria-hidden="true">BQ</span><span>BrightQuiz</span></a>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false"><span aria-hidden="true">Theme</span> <span class="theme-label">mode</span></button>
  </header>
  <main>
    <section class="hero" aria-labelledby="quiz-title">
      <p class="eyebrow">Study check / General knowledge</p>
      <h1 id="quiz-title">Make your best<br>answer count.</h1>
      <p class="hero-copy">Ten short questions. Work through them at your pace, then check the answers you missed.</p>
    </section>
    <section class="quiz-shell" id="quiz" aria-labelledby="question-title">
      <div class="quiz-topbar">
        <div>
          <p class="question-count" aria-live="polite">Question 1 of 10</p>
          <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1"><span class="progress-value"></span></div>
        </div>
        <p class="answered-count">0 answered</p>
      </div>
      <form class="quiz-form" novalidate>
        <fieldset class="question-card">
          <legend id="question-title" tabindex="-1"></legend>
          <p class="question-help">Choose one answer.</p>
          <div class="answers" role="radiogroup" aria-labelledby="question-title"></div>
        </fieldset>
        <p class="form-message" role="alert" aria-live="assertive"></p>
        <div class="quiz-actions">
          <button class="button button-secondary previous-button" type="button">Previous</button>
          <button class="button button-primary next-button" type="button">Next question <span aria-hidden="true">&gt;</span></button>
        </div>
      </form>
    </section>
    <section class="results" hidden aria-labelledby="results-title">
      <p class="eyebrow">Quiz complete</p>
      <h2 id="results-title">Here is how you did.</h2>
      <div class="score-panel"><span class="score-number">0%</span><p class="score-summary"></p></div>
      <div class="review-list" aria-label="Answer review"></div>
      <div class="result-actions">
        <button class="button button-secondary home-button" type="button">Back to quiz</button>
        <button class="button button-primary retry-button" type="button">Try again</button>
      </div>
    </section>
  </main>
  <footer>BrightQuiz - a focused study check.</footer>
  <script src="script.js"></script>
</body>
</html>
